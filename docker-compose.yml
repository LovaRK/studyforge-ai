# Local Postgres for development. Start it with `npm run db:up`, which passes
# the credentials from DATABASE_URL in .env.local.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studyforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studyforge}
      POSTGRES_DB: ${POSTGRES_DB:-studyforge}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - studyforge-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  studyforge-pgdata:
